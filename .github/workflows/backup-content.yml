name: Weekly content snapshot

on:
  schedule:
    - cron: "30 18 * * 0" # Sundays, 18:30 UTC (Monday morning in Brisbane)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save the published content (entries, projects, site settings)
        run: python3 scripts/backup_content.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/public-content.json
          git diff --cached --quiet || git commit -m "Weekly content snapshot"
          git push
