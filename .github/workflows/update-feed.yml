name: Update devlog feed and sitemap

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate devlog/feed.xml from Supabase
        run: python3 scripts/generate_feed.py

      - name: Regenerate sitemap.xml (every live project and devlog entry)
        run: python3 scripts/build_sitemap.py

      - name: Commit and push if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add devlog/feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Update devlog feed and sitemap"
          git push

      # Optional: emails subscribers about entries that went live since the last run (this is how
      # scheduled entries get announced). Needs the NOTIFY_URL and CRON_SECRET repository secrets;
      # skipped when they aren't set. See SETUP.md, "Emails".
      - name: Email subscribers about new entries
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$NOTIFY_URL" ] && [ -n "$CRON_SECRET" ]; then
            curl -fsS -X POST "$NOTIFY_URL" -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
          else
            echo "NOTIFY_URL / CRON_SECRET not set: skipping"
          fi
