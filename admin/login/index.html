<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login | Seventh Boar Development</title>
    <link rel="icon" type="image/png" href="../../assets/images/seventh-boar-mark.png" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="site-frame">
    <header class="site-header">
      <div class="shell nav-shell">
        <a class="brand" href="/" aria-label="Seventh Boar Development home">
          <img src="../../assets/images/seventh-boar-mark.png" alt="" />
          <span>
            <strong>Seventh Boar</strong>
            <em>Development</em>
          </span>
        </a>
      </div>
    </header>

    <main>
      <div class="shell">
        <div class="auth-wrap">
          <div class="auth-card">
            <h1>Studio Login</h1>
            <p class="lead">Sign in to write a journal post or add a project.</p>

            <div class="form-error" id="formError">Incorrect email or password. Try again.</div>

            <form id="loginForm">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username" />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" />
              </div>
              <button type="submit" class="button" style="width: 100%">Log In</button>
            </form>

            <p style="margin-top: 1.5rem">
              <a href="/" style="font-size: 0.9rem; color: var(--ink-soft)">&larr; Back to the site</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/cms.js"></script>
    <script src="../../assets/js/admin-login.js"></script>
  </body>
</html>
