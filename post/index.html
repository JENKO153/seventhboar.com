<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Devlog | Seventh Boar Development</title>
    <link rel="icon" type="image/png" href="/assets/images/seventh-boar-mark.png" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body class="site-frame" data-nav="devlog">
    <header class="site-header">
      <div class="shell nav-shell">
        <a class="brand" href="/" aria-label="Seventh Boar Development home">
          <img src="/assets/images/seventh-boar-mark.png" alt="" />
          <span>
            <strong>Seventh Boar</strong>
            <em>Development</em>
          </span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7" />
          </svg>
        </button>
        <nav class="site-nav" id="site-menu" data-nav-panel>
          <a href="/" data-page="home">Home</a>
          <a href="/work/" data-page="work">Work</a>
          <a href="/services/" data-page="services">Services</a>
          <a href="/devlog/" data-page="devlog">Devlog</a>
          <a href="/about/" data-page="about">About</a>
          <a href="/contact/" data-page="contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="postContainer">
      <div class="shell" style="padding: 4rem 0; text-align: center; color: var(--ink-soft)">Loading...</div>
    </main>

    <section class="section" id="relatedSection" style="display: none">
      <div class="shell">
        <div class="section-header">
          <div class="eyebrow">More From The Devlog</div>
          <h2 class="section-title">Related entries.</h2>
        </div>
        <div class="article-grid" id="relatedPosts"></div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="shell footer-panel">
        <div class="footer-bar">
          <span>&copy; <span data-year></span> Seventh Boar Development</span>
          <span>Studio devlog.</span>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/cms.js"></script>
    <script src="/assets/js/reveal.js"></script>
    <script src="/assets/js/journal-post.js"></script>
    <script src="/assets/js/site.js"></script>
  </body>
</html>
