# Supabase CLI settings used when deploying the Edge Functions (see SETUP.md, "Emails").
# Neither function uses the gateway's token check:
#   subscribe      is called by visitors, who aren't logged in (spam-checked inside the function)
#   notify-posts   checks the admin's session and password window itself, or the hourly job's secret
project_id = "seventhboar"

[functions.subscribe]
verify_jwt = false

[functions.notify-posts]
verify_jwt = false

# The public request form; spam-checked inside the function.
[functions.submit-request]
verify_jwt = false

# Called from the admin's Orders screen; checks the admin's session and password window itself.
[functions.request-update]
verify_jwt = false
